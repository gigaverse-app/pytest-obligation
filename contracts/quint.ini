# Model contracts: Quint models replayed against the real code by pytest-quint-connect.
# Run only through this file. The full run, as CI runs it, requires every listed contract:
#   uv run --no-sync pytest -c contracts/quint.ini contracts --quint-require-complete
# Without the flag, one contract or a --quint-replay of a saved trace exits 0 when its cases pass.
# contracts/ mirrors the import path of the code each contract models; see contracts/README.md.
[pytest]
python_files = test_*_contract.py
pythonpath = ../package/src ../package/tests_support
# Default (prepend) import mode puts each contract's folder on sys.path, so its conftest.py can
# import the generated driver beside it. Test and driver module names are unique per contract.
addopts = -p no:cacheprovider --rootdir=contracts
quint_required_contracts =
    report-merge
    cost-baseline
    fenced-lease
