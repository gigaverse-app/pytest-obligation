dependencies:
  - inputs:
      - "model.qnt"
      - "quint-connect.json"
      - "README.md"
      - "history/**"
      - "//contracts/quint.ini"
    kind: content
    reason: >-
      pytest-quint-connect loads the manifest and the model by name, replays the planted bugs' frozen code from
      history/, and runs under contracts/quint.ini, which lists the required contracts; the README is the
      contract's documented rule, reviewed with the model.
