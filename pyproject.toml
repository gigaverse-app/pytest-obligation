[dependency-groups]
lint = ["ruff>=0.8", "pyrefly>=1.0,<2", "django-stubs>=5.1", "celery-types>=0.22"]
# The demo applications' own runtimes; procrastinate is installed from the pinned
# demo checkout (its demos ship only in the source tree) by the demos CI job.
demos = [
    "dbos==3.1.0",
    "django-tasks-db==0.13.0",
    "fastapi[standard]>=0.115.0",
    "wagtail==8.0",
]
# Adopters split sessions across workers; the verify option must hold there too.
xdist = ["pytest-obligation[selftest]"]
dev = [ { include-group = "lint" }, { include-group = "xdist" }]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
extend = "package/pyproject.toml"
src = ["package/src", "package/shims", "package", "."]
extend-exclude = ["demos/.upstream", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["package/tests", "integration_tests"]
# The Django self-tests and demos import their settings modules from the repository root.
pythonpath = ["package", ".", "examples/adopter"]
addopts = "-p no:cacheprovider"

[tool.pyrefly]
project-includes = ["package/src", "package/shims", "package/tests", "package/tests_support", "integration_tests", "demos", "scripts", "examples/adopter", "examples/shopify_billing", "examples/checkout_tutorial", "examples/rq_tutorial"]
# The Saleor demo runs in Saleor's own environment and is type-checked there (see its pyproject.toml).
project-excludes = ["demos/.upstream/**", "demos/saleor_checkout/**", "**/__pycache__/**", ".venv*/**"]
python-version = "3.11"
python-platform = "linux"
# tests_support holds the sample production package the binding self-tests import;
# the DBOS demo imports the upstream demo module from its pinned checkout.
search-path = ["package/src", "package/shims", "package", ".", "package/tests_support", "examples/adopter", "examples/checkout_tutorial", "examples/checkout_tutorial/tests", "examples/rq_tutorial", "examples/rq_tutorial/tests", "demos/.upstream/dbos-demo-apps/python/transactional-outbox"]

[tool.uv.workspace]
members = ["package"]

[tool.uv.sources]
pytest-obligation = { workspace = true }
