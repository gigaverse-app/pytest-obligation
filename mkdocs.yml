site_name: pytest-obligation
site_description: Test background work against crashes, retries, and duplicate delivery
  with executable conformance checks.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://pytest-obligation.readthedocs.io/en/latest/"]
repo_url: https://github.com/gigaverse-app/pytest-obligation
repo_name: gigaverse-app/pytest-obligation
edit_uri: ''
docs_dir: documentation
site_dir: site
strict: true
exclude_docs: '*.py

  *.txt

  *.in

  overrides/

  '
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  custom_dir: documentation/overrides
  language: en
  font: false
  palette:
    primary: teal
    accent: cyan
  features:
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
hooks:
- documentation/hooks.py
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra:
  published_sources:
  - package/docs/tutorials.md
  - package/docs/tutorial-many-systems.md
  - package/docs/tutorial-framework-authors.md
  - package/docs/many-systems-1-describe.md
