name: pytest-obligation report
description: Explain passing evidence, missing coverage, rejected bindings and failures in one updated PR comment. Fork PRs get theirs from the publish action in a workflow_run job.
branding:
  icon: shield
  color: blue
inputs:
  python-version:
    description: Python used to parse application source; choose a version supporting the adopter's syntax.
    default: '3.11'
  suite-decorators:
    description: Newline-separated fully-qualified application wrapper decorators. Native obligation and Due suites are recognized by default.
    default: ''
  report-path:
    description: JSON file or glob produced by pytest --due-work-profile-report in this run. Shards must share the same code revision and declarations.
    default: obligation-profiles.json
  expected-reports:
    description: Expected number of shard reports. Missing shards keep the aggregate from claiming complete evidence.
    default: '0'
  application-paths:
    description: Newline-separated repository-relative Python source files/directories to inventory without importing or collecting tests. Checkout the tested revision first. Static decorator declarations are listed even when their tests are not selected.
    default: ''
  inventory-path:
    description: Revision-bound collected inventory from the collect action; provides exact generated test counts.
    default: ''
  junit-path:
    description: Current-run JUnit glob to distinguish executed and skipped collected tests.
    default: ''
  github-token:
    description: Token with pull-requests write for same-repository PR comments. No token is needed for summary-only use.
    default: ${{ github.token }}
  post-comment:
    description: Update one PR comment on same-repository PRs. A fork PR's run cannot comment; it keeps the summary and artifact, and the publish action posts its sticky from a trusted workflow_run job.
    default: 'true'
  sticky-key:
    description: Stable key for this workflow or test lane; use distinct keys for separate sessions.
    default: obligation
  test-outcome:
    description: Outcome of the test step (steps.tests.outcome), so collection or unrelated failures remain visible.
    default: unknown
  graphics:
    description: Compose fixed SVG digits and labels in the comment. No image uploads or contents write permission. Set false for plain text.
    default: 'true'
  readme-path:
    description: >-
      Markdown document to keep the report in, between the lines <!-- pytest-obligation:start --> and
      <!-- pytest-obligation:end -->, which it must already contain. The copy leaves out run-specific times,
      the run link and commit-pinned source links, so it changes only when the evidence does. Committing it is
      the caller's step.
    default: ''
  readme-source:
    description: The source line shown in the document's copy, for example "daily run against upstream main".
    default: ''
  badge-path:
    description: >-
      File to write the report's headline to as a shields.io endpoint badge
      (https://img.shields.io/endpoint?url=<raw URL of the committed file>).
    default: ''
outputs:
  markdown-path:
    description: Rendered Markdown, also included in the job summary and uploaded artifact.
    value: ${{ steps.render.outputs.markdown-path }}
runs:
  using: composite
  steps:
    - id: runtime
      shell: bash
      run: |
        if command -v uv >/dev/null; then echo 'uv=true' >> "$GITHUB_OUTPUT"; fi
    - uses: astral-sh/setup-uv@v7
      if: ${{ steps.runtime.outputs.uv != 'true' }}
      with:
        enable-cache: 'false'
    - name: Render executed evidence
      id: render
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
        EXPECTED_REPORTS: ${{ inputs.expected-reports }}
        REPORTER_PACKAGE: ${{ github.action_path }}/../package
        REPORT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        REPORT_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        TEST_OUTCOME: ${{ inputs.test-outcome }}
        REPORT_ASSET_REF: ${{ github.action_ref || github.sha }}
        REPORT_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        REPORT_GRAPHICS: ${{ inputs.graphics }}
        INVENTORY_PYTHON: ${{ inputs.python-version }}
        SUITE_DECORATORS: ${{ inputs.suite-decorators }}
        APPLICATION_PATHS: ${{ inputs.application-paths }}
        INVENTORY_PATH: ${{ inputs.inventory-path }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        README_PATH: ${{ inputs.readme-path }}
        README_SOURCE: ${{ inputs.readme-source }}
        BADGE_PATH: ${{ inputs.badge-path }}
      run: |
        workspace="$(mktemp -d "$RUNNER_TEMP/obligation-report.XXXXXX")"
        output="$workspace/report.md"
        graphics_args=()
        if [[ "$REPORT_GRAPHICS" == 'true' ]]; then graphics_args+=(--graphics); fi
        inventory_args=()
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then inventory_args+=(--application-path "$path"); fi
        done <<< "$APPLICATION_PATHS"
        while IFS= read -r decorator; do
          if [[ -n "$decorator" ]]; then inventory_args+=(--suite-decorator "$decorator"); fi
        done <<< "$SUITE_DECORATORS"
        if [[ -n "$INVENTORY_PATH" ]]; then
          inventory_args+=(--inventory "$INVENTORY_PATH" --collection-revision "$(git rev-parse HEAD)")
        fi
        if [[ -n "$JUNIT_PATH" ]]; then inventory_args+=(--junit-input "$JUNIT_PATH"); fi
        document_args=()
        if [[ -n "$README_PATH" ]]; then
          document_args+=(--readme "$GITHUB_WORKSPACE/$README_PATH" --readme-source "$README_SOURCE")
        fi
        if [[ -n "$BADGE_PATH" ]]; then document_args+=(--badge "$GITHUB_WORKSPACE/$BADGE_PATH"); fi
        uvx --python "$INVENTORY_PYTHON" --from "$REPORTER_PACKAGE[report]" python -I -m pytest_obligation.reporting \
          --input "$REPORT_PATH" --expected-reports "$EXPECTED_REPORTS" --output "$output" \
          --source "PR head $REPORT_HEAD · workflow commit $GITHUB_SHA · run $GITHUB_RUN_ID · attempt $GITHUB_RUN_ATTEMPT" \
          --run-url "$REPORT_RUN" --test-outcome "$TEST_OUTCOME" --asset-ref "$REPORT_ASSET_REF" \
          --repository-url "$REPORT_REPOSITORY" --revision "$GITHUB_SHA" "${graphics_args[@]}" "${inventory_args[@]}" \
          "${document_args[@]}" --stage-artifact "$workspace/artifact"
        echo "markdown-path=$output" >> "$GITHUB_OUTPUT"
        echo "artifact-path=$workspace/artifact" >> "$GITHUB_OUTPUT"
    # Fixed names (manifest.json, report.md, inventory.json, reports/, junit/) let the publish action
    # re-render this evidence as data in a trusted job, without interpreting any uploaded path.
    - name: Preserve full evidence and rendered report
      uses: actions/upload-artifact@v7
      with:
        name: obligation-${{ inputs.sticky-key }}-${{ github.run_attempt }}
        path: ${{ steps.render.outputs.artifact-path }}
        if-no-files-found: error
    - name: Update PR report
      # Runs on fork PRs too, only to say in the log and summary that a workflow_run publisher posts the sticky.
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v8
      env:
        OBLIGATION_MARKDOWN: ${{ steps.render.outputs.markdown-path }}
        OBLIGATION_STICKY_KEY: ${{ inputs.sticky-key }}
        OBLIGATION_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const publish = require(`${process.env.OBLIGATION_ACTION_PATH}/publish.cjs`);
          await publish({github, context, core});
