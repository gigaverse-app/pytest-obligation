name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs from uv.lock with --locked: a lock that no longer matches
# pyproject.toml fails CI instead of silently resolving something new.

jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        uses: gigaverse-app/pytest-selective/.github/actions/plan-lanes@5d13b3873d49f4714208d430c812957bf6c97b29
        with:
          config: .github/test-lanes.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
      - name: Keep the changed paths and lane-selection reason
        uses: actions/upload-artifact@v7
        with:
          name: test-lane-selection
          path: test-lanes.json
          if-no-files-found: error

  ci-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Prove consumer routing and documentation checks
        # Resolve from the action pin above, so tests cannot silently use a different selector.
        run: >-
          uv run --no-project --python 3.14
          --with "$(python scripts/ci/selector_requirement.py)"
          python -m unittest discover -s ci_tests -v
      - name: Check local documentation links
        run: python scripts/ci/check_docs.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --only-group lint
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  typecheck:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).typecheck) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The demos type-check against the upstream code they run (Saleor's in its own job).
      - run: uv run --no-project python demos/fetch_upstream.py procrastinate dbos-demo-apps
      - run: uv sync --all-packages --locked --all-extras --group demos
      - run: uv pip install -e demos/.upstream/procrastinate
      - run: uv run --no-sync pyrefly check

  core:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).core) }}
    # The core must work with no framework installed: the package, pytest and pytest-xdist only.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # xdist is no framework: it lets the verify option's self-tests split a session across workers.
      - run: uv sync --all-packages --python ${{ matrix.python }} --locked --no-default-groups --extra debt --group xdist
      - run: uv run --python ${{ matrix.python }} --no-sync python scripts/check_core_is_framework_free.py
      - run: uv run --python ${{ matrix.python }} --no-sync python -m compileall -q package/src/pytest_obligation
      - name: Prove package-only core controls need no application checkout
        if: matrix.python == '3.12'
        run: |
          package_dir=$(mktemp -d)
          git archive HEAD:package | tar -x -C "$package_dir"
          uv run --directory "$package_dir" --extra selftest python -m pytest tests/core
      - run: uv run --python ${{ matrix.python }} --no-sync pytest package/tests/core integration_tests/core

  minimum-models:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).minimum_models) }}
    # Exercise nested generic declarations on the supported minimum, without Hypothesis or frameworks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked --no-default-groups --extra debt --group xdist
      # This lane deliberately checks the declared lower bound, not uv.lock's current release.
      - run: uv pip install 'pydantic==2.11.0'
      - run: uv run --no-sync python scripts/check_core_is_framework_free.py
      - run: uv run --no-sync pytest package/tests/core integration_tests/core
      - run: uv run --no-sync pytest examples/adopter/tests --due-work-check-fixtures --due-work-require-assessed

  exploration:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).exploration) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra debt --extra exploration --group xdist
      - run: uv run --no-sync pytest package/tests/core integration_tests/core

  django:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).django) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
      PGDATABASE: pytest_obligation
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # pytest-django gives each xdist worker its own test database.
      - run: uv sync --all-packages --locked --no-default-groups --extra django --extra celery --extra exploration --group xdist
      - run: uv run --no-sync pytest package/tests/django examples/adopter/tests_django --ds=tests.django.settings -n 4

  # The same suite on psycopg2, which Django uses when psycopg 3 is not installed: pretix and many older
  # projects run on it, and the host's autocommit-write probe once assumed psycopg 3.
  django-psycopg2:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).django_psycopg2) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
      PGDATABASE: due_work_harness_psycopg2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra django --extra celery --extra exploration --group xdist
      - run: uv pip uninstall psycopg psycopg-binary && uv pip install psycopg2-binary
      - run: uv run --no-sync pytest package/tests/django examples/adopter/tests_django --ds=tests.django.settings -n 4

  # Redis-backed queues, and Celery's real worker as a child process on a Redis broker.
  redis:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).redis) }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra rq --extra celery --extra exploration --group xdist
      # Each xdist worker takes its own four Redis databases (tests/redis_databases.py), so cases that
      # empty theirs cannot wipe another worker's; four workers use all 16 of the service's databases.
      - run: uv run --no-sync pytest package/tests/rq package/tests/celery_worker integration_tests/rq integration_tests/celery_worker -p no:django -rxX -n 4 --durations=10 --due-work-explore=smoke --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-redis.json --junitxml=adopters-redis.xml

      - name: Require the promised adopters and executed capabilities
        run: |
          uv run --no-sync python scripts/check_adoption_report.py profiles-redis.json --contract "catalog on RQ" --contract "catalog through Celery" --verified E G H I
          uv run --no-sync python scripts/check_adoption_report.py profiles-redis.json --contract "rq reference jobs" --verified G J --exercised H B
          uv run --no-sync python scripts/check_adoption_cases.py adopters-redis.xml --replay "*TestRQWorkerContract*REPLAY_SAFE_EXECUTION" --replay "*TestCeleryWorkerContract*REPLAY_SAFE_EXECUTION" --replay "*TestCatalogOnRQ*REPLAY_SAFE_EXECUTION" --replay "*TestCatalogThroughCelery*REPLAY_SAFE_EXECUTION"
          uv run --no-sync python scripts/check_adoption_cases.py adopters-redis.xml --case "*TestCatalogOnRQ*extra-recovery-poison*" --case "*TestCatalogOnRQ*extra-recovery-stop*"
          uv run --no-sync python scripts/check_adoption_cases.py adopters-redis.xml --case "*TestCatalogThroughCelery*extra-recovery-poison*" --case "*TestCatalogThroughCelery*extra-recovery-stop*"
      - name: Keep executed profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-redis
          path: |
            profiles-*.json
            demos/**/profiles-*.json
            adopters-*.xml
            demos/**/adopters-*.xml
          if-no-files-found: error

  mongodb:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).mongodb) }}
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra mongodb
      # Transactions need a replica set on this disposable runner.
      - run: |
          docker run -d --name due-work-mongodb -p 27017:27017 mongo:7 --replSet dwh --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec due-work-mongodb mongosh --quiet --eval 'rs.initiate({_id:"dwh",members:[{_id:0,host:"localhost:27017"}]})'; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
      - run: uv run --no-sync pytest package/tests/mongodb -q

  aiokafka:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).aiokafka) }}
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s --health-timeout 10s --health-retries 12
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra aiokafka
      - run: uv run --no-sync pytest package/tests/aiokafka -q

  prefect:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).prefect) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked --no-default-groups --extra prefect --extra exploration
      - run: uv run --no-sync pytest package/tests/prefect integration_tests/prefect -q --due-work-explore=smoke --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-prefect.json --junitxml=adopters-prefect.xml --durations=20

      - name: Require the promised adopters and executed capabilities
        run: |
          uv run --no-sync python scripts/check_adoption_report.py profiles-prefect.json --contract "catalog through Prefect engine" --verified E G H I
          uv run --no-sync python scripts/check_adoption_cases.py adopters-prefect.xml --case "*extra-recovery-poison*" --case "*extra-recovery-stop*"
      - name: Keep executed profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-prefect
          path: |
            profiles-*.json
            demos/**/profiles-*.json
            adopters-*.xml
            demos/**/adopters-*.xml
          if-no-files-found: error

  demos:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).demos) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v7
        with:
          # The check action builds the harness from this checkout; its version comes from git tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Saleor too: the README's demo GIF shows the coverage scan of its checkout. Wagtail's source is
      # what the Wagtail demo's coverage check reads; the demo itself runs the wheel from PyPI.
      - run: uv run --no-project python demos/fetch_upstream.py procrastinate dbos-demo-apps saleor wagtail
      - run: uv sync --all-packages --locked --no-default-groups --extra django --extra exploration --group demos
      # procrastinate's demos ship only in its source tree, pinned by fetch_upstream.py.
      - run: uv pip install -e demos/.upstream/procrastinate
      - name: Postgres without durability
        run: demos/throwaway_postgres.sh
      # The durations are the evidence for the next change to this job's speed.
      - name: procrastinate demo_django
        env:
          PGDATABASE: procrastinate_demo
        run: >-
          uv run --no-sync pytest demos/procrastinate_demo_django --ds=demos.procrastinate_demo_django.settings
          -rxX --durations=15 --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-procrastinate.json --junitxml=adopters-procrastinate.xml
      - name: DBOS transactional-outbox
        run: uv run --no-sync pytest demos/dbos_transactional_outbox -p no:django -rxX --durations=15 --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-dbos.json --junitxml=adopters-dbos.xml
      # Migrating Wagtail's test database is most of its run, and depends only on the pinned packages
      # (uv.lock) and the demo's settings: restored from the cached dump when the key matches.
      - uses: actions/cache@v4
        with:
          path: demos/.ci-cache/wagtail_tasks.dump
          key: wagtail-test-db-pg16-${{ hashFiles('uv.lock', 'demos/wagtail_tasks/settings.py', 'demos/cached_database.py') }}
      - name: Wagtail's test database, migrated once
        # As pytest-django creates a test database: every app's migrations, syncdb for the rest, no checks.
        run: >-
          uv run --no-sync python demos/cached_database.py test_wagtail_tasks --dump demos/.ci-cache/wagtail_tasks.dump
          -- uv run --no-sync python -m django migrate --settings=demos.wagtail_tasks.settings
          --run-syncdb --skip-checks --no-input --verbosity 0
      # Wagtail 8.0 on django-tasks-db, both from PyPI; the demo's own directory is pytest's rootdir.
      - name: Wagtail on django-tasks-db
        working-directory: demos/wagtail_tasks
        env:
          PGDATABASE: wagtail_tasks
        run: uv run --no-sync --project ../.. pytest --reuse-db --due-work-verify --durations=15 --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-wagtail.json --junitxml=adopters-wagtail.xml
      - name: the README's demo GIF prints what the harness prints
        run: uv run --no-sync pytest demos/test_readme_gif.py -p no:django --durations=15
      # Each demo is an adopter: its handoffs are checked the way an adopter's CI checks them.
      - name: procrastinate demo_django, every handoff accounted for
        uses: ./check
        with:
          working-directory: demos/procrastinate_demo_django
          package: ${{ github.workspace }}/package
      - name: DBOS transactional-outbox, every handoff accounted for
        uses: ./check
        with:
          working-directory: demos/dbos_transactional_outbox
          package: ${{ github.workspace }}/package
      - name: Wagtail on django-tasks-db, every handoff accounted for
        uses: ./check
        with:
          working-directory: demos/wagtail_tasks
          package: ${{ github.workspace }}/package

      - name: Require the promised adopters and executed capabilities
        run: |
          uv run --no-sync python scripts/check_adoption_cases.py adopters-procrastinate.xml --replay "*TestTheDemoAsShipped*REPLAY_SAFE_EXECUTION" --replay "*TestTheDemoWithItsFixes*REPLAY_SAFE_EXECUTION"
          uv run --no-sync python scripts/check_adoption_cases.py adopters-dbos.xml --replay "*TestPlaceOrder*REPLAY_SAFE_EXECUTION"
          uv run --no-sync python scripts/check_adoption_cases.py demos/wagtail_tasks/adopters-wagtail.xml --replay "*TestWagtailMedia*REPLAY_SAFE_EXECUTION-feature" --replay "*TestWagtailMedia*REPLAY_SAFE_EXECUTION-image" --replay "*TestWagtailMedia*REPLAY_SAFE_EXECUTION-document" --replay "*TestWagtailPublishing*REPLAY_SAFE_EXECUTION"
          uv run --no-sync python scripts/check_adoption_report.py profiles-procrastinate.json --contract "procrastinate demo_django: create book" --contract "procrastinate demo_django: create book, with its fixes" --exercised I
          uv run --no-sync python scripts/check_adoption_report.py profiles-dbos.json --contract "DBOS transactional-outbox: place order" --verified I --exercised H J
          uv run --no-sync python scripts/check_adoption_report.py demos/wagtail_tasks/profiles-wagtail.json --contract "wagtail: image and document lifecycle" --contract "wagtail: publishing a page behind a CDN" --exercised I --verified H J
          uv run --no-sync python scripts/check_adoption_report.py demos/wagtail_tasks/profiles-wagtail.json --contract "wagtail: image and document lifecycle" --exercised E
          uv run --no-sync python scripts/check_adoption_cases.py demos/wagtail_tasks/adopters-wagtail.xml --case "*TestDatabaseWorkerRows*database_legal*" --case "*TestDatabaseWorkerRows*inadmissible*" --case "*TestDatabaseWorkerRows*poisoned_identity*" --case "*TestDatabaseWorkerRows*soft_time_limit*" --case "*TestDatabaseWorkerRows*assert_selection_is_complete*"
      - name: Keep executed profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-demos
          path: |
            profiles-*.json
            demos/**/profiles-*.json
            adopters-*.xml
            demos/**/adopters-*.xml
          if-no-files-found: error

  saleor:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).saleor) }}
    # Saleor's checkout, unmodified, in Saleor's own environment built from its uv.lock.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saleor
      # Absolute: run.sh works in the demo directory.
      SALEOR_DATABASE_DUMP: ${{ github.workspace }}/demos/.ci-cache/saleor.dump
    steps:
      - uses: actions/checkout@v7
        with:
          # The check action builds the harness from this checkout; its version comes from git tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Saleor's pin lives in fetch_upstream.py; its lock is fetched after this step.
          cache-dependency-glob: |
            uv.lock
            demos/fetch_upstream.py
      - run: uv run --no-project python demos/fetch_upstream.py saleor
      - name: Type-check the demo against Saleor
        run: demos/saleor_checkout/run.sh --typecheck
      - name: Saleor, every handoff accounted for
        uses: ./check
        with:
          working-directory: demos/saleor_checkout
          package: ${{ github.workspace }}/package
      - name: Postgres without durability
        run: demos/throwaway_postgres.sh
      # Saleor's migrations depend only on its pin (in fetch_upstream.py): their result is cached as a
      # dump, restored in seconds instead of migrating for two minutes.
      - uses: actions/cache@v4
        with:
          path: ${{ env.SALEOR_DATABASE_DUMP }}
          key: saleor-test-db-pg16-${{ hashFiles('demos/fetch_upstream.py', 'demos/saleor_checkout/prepare_db.py', 'demos/cached_database.py') }}
      # One xdist worker per runner CPU. Four workers each migrating their own database took
      # 193 s apiece; migrating once and cloning a copy per worker costs one migration.
      - name: Saleor's test databases, migrated once
        run: demos/saleor_checkout/run.sh --prepare-db 4
      # The durations are the evidence for the next change to this job's speed. --dist worksteal was
      # tried: pytest took 75 s and 80 s, inside the 66 to 91 s this step takes with the default on the
      # same code, as runners vary. No gain was measurable, so the default stays.
      - name: Saleor checkout
        run: demos/saleor_checkout/run.sh -rxX --due-work-explore=smoke --due-work-verify -n 4 --reuse-db --durations=15 --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-saleor.json --junitxml=adopters-saleor.xml

      - name: Require the promised adopters and executed capabilities
        run: |
          demos/.upstream/saleor/.venv/bin/python scripts/check_adoption_cases.py demos/saleor_checkout/adopters-saleor.xml --replay "*TestCheckoutAsShipped*REPLAY_SAFE_EXECUTION" --replay "*TestCheckoutWithAutomaticCompletion*REPLAY_SAFE_EXECUTION"
          demos/.upstream/saleor/.venv/bin/python scripts/check_adoption_report.py demos/saleor_checkout/profiles-saleor.json --contract "saleor checkout" --contract "saleor checkout, Transactions API with automatic completion" --exercised H I
          demos/.upstream/saleor/.venv/bin/python scripts/check_adoption_report.py demos/saleor_checkout/profiles-saleor.json --contract "saleor payment event reports" --verified E --exercised I
          demos/.upstream/saleor/.venv/bin/python scripts/check_adoption_cases.py demos/saleor_checkout/adopters-saleor.xml --case "*TestCheckoutWithAutomaticCompletion*database_legal*" --case "*TestCheckoutWithAutomaticCompletion*inadmissible*" --case "*TestAutomaticCompletionRelatedRows*database_legal*" --case "*TestAutomaticCompletionRelatedRows*inadmissible*" --case "*TestAutomaticCompletionRelatedRows*poisoned_identity*" --case "*TestAutomaticCompletionRelatedRows*soft_time_limit*"
      - name: Keep executed profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-saleor
          path: |
            profiles-*.json
            demos/**/profiles-*.json
            adopters-*.xml
            demos/**/adopters-*.xml
          if-no-files-found: error

  build:
    # The published wheel alone: it installs without any framework, imports, and ships py.typed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from tags, so build with the history that has them.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build --project package --out-dir dist
      - name: Validate package metadata and Markdown rendering
        run: |
          uvx --from twine==7.0.0 twine check --strict dist/*
          python scripts/ci/check_metadata.py
      - run: unzip -l dist/*.whl | grep -q "pytest_obligation/py.typed"
      - run: unzip -l dist/*.whl | grep -q "due_work_harness/py.typed"
      - run: uv venv /tmp/wheel && uv pip install --python /tmp/wheel dist/*.whl
      - run: /tmp/wheel/bin/python scripts/check_core_is_framework_free.py
      - name: Verify old and new adopters against the installed wheel
        run: /tmp/wheel/bin/python -m pytest package/tests/core/test_compatibility.py package/tests/core/test_package_identity.py -q

  actions:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).actions) }}
    # The published GitHub Actions, run against the example adopter the way a project would use them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check passes on a project whose every handoff is accounted for
        uses: ./check
        with:
          working-directory: examples/adopter
          package: ${{ github.workspace }}/package
      - name: test runs the project's generated suites without Hypothesis
        uses: ./test
        with:
          working-directory: examples/adopter
          pytest-args: --due-work-check-fixtures --due-work-require-assessed
      - name: Generated histories also support optional search
        uses: ./test
        with:
          working-directory: examples/adopter
          sync-args: --extra exploration
          pytest-args: --due-work-explore=smoke --due-work-check-fixtures --due-work-require-assessed --due-work-profile-report=profiles-example.json --junitxml=adopters-example.xml
      - name: Replay and sensitivity controls
        working-directory: examples/adopter
        run: uv run --no-sync pytest tests/test_catalog_failures.py
      - name: Require example capabilities
        working-directory: examples/adopter
        run: |
          uv run --no-sync python ../../scripts/check_adoption_report.py profiles-example.json --contract "example catalog" --verified E G H I
          uv run --no-sync python ../../scripts/check_adoption_cases.py adopters-example.xml --case "*extra-recovery-poison*" --case "*extra-recovery-stop*" --case "*TestOptionalAlert*test_the_exemption_holds"
      - name: Keep example profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-example
          path: |
            examples/adopter/profiles-example.json
            examples/adopter/adopters-example.xml
          if-no-files-found: error
      - name: check fails once a handoff loses its disposition
        run: |
          rm examples/adopter/tests/test_summaries_exemption.py
          if uvx --from "$GITHUB_WORKSPACE/package" due-work-harness check --root examples/adopter; then
            echo "::error::the check passed a project with an unaccounted handoff" >&2
            exit 1
          fi

  due:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).due) }}
    # The complete work-table harness lives with Due's runtime. Install this PR's
    # wheel over its locked obligation dependency and prove the packages together.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: due
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U due"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/due
      DUE_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: gigaverse-app/due
          # Paired recovery integration: Due PR #55 binds this shared API.
          ref: a53c7366bd1db0edebc3bb2113a811323b8a3cdc
          path: .upstream/due
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.14'
      - run: uv build --project package --out-dir dist --wheel
      - run: uv sync --all-packages --locked --project .upstream/due
      - name: Install the candidate wheel
        run: uv pip install --python .upstream/due/.venv/bin/python --no-deps --reinstall dist/*.whl
      - name: Run independent Due library controls
        working-directory: .upstream/due
        run: .venv/bin/python -m pytest -c package/pyproject.toml package/tests --due-work-check-fixtures --due-work-profile-report=library-profiles.json --durations=20
      - name: Run complete work-table and application conformance
        working-directory: .upstream/due
        run: >-
          .venv/bin/python -m pytest -p due.django.conformance.reporting
          --due-work-check-fixtures --due-work-debt-baseline=integration_tests/conformance/debt_baseline.yaml
          --due-work-profile-report=profiles.json
          --durable-work-report=effects.json --durable-observation-report=observations.json
          --junitxml=results.xml --durations=20
      - name: Require executed primitive and application guarantees
        working-directory: .upstream/due
        run: |
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract "Due replay-safe work table" --verified A B D I J
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract publish_document --verified A B D E H I J --effect-report effects.json --effect publish_document
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract index_book --verified A B D H I J --effect-report effects.json --effect index_book --required-effect-case "test_due_work_contract[completion-searchable book-assert_completes_within]" --required-effect-case "test_immutable_inputs_hold[admission-create book]" --required-effect-case "test_immutable_inputs_hold[admission_failure-create book]"
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract publish_book --verified A B D H J --effect-report effects.json --effect publish_book --required-effect-case "test_immutable_inputs_hold[producer-index settlement]"
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract project_catalog --verified A B D E H I J --effect-report effects.json --effect project_catalog
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract print_order --verified A B C I J --effect-report effects.json --effect print_order
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract publish_at_deadline --verified A B E H I J --effect-report effects.json --effect publish_at_deadline
          .venv/bin/python scripts/check_adoption_report.py profiles.json --contract checkout_order --verified A B G I J --effect-report effects.json --effect checkout_order --required-effect-case "test_due_work_contract[completion-paid hints-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-paid sweep-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-failed hints-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-failed sweep-assert_completes_within]" --required-effect-case "test_due_work_contract[delivery-replay-final dispatch-assert_delivery_replay]"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: due-conformance
          path: |
            .upstream/due/library-profiles.json
            .upstream/due/profiles.json
            .upstream/due/effects.json
            .upstream/due/observations.json
            .upstream/due/results.xml
          if-no-files-found: error
