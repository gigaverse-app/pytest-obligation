version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /publish
    schedule:
      interval: monthly
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /publish
    schedule:
      interval: monthly
    commit-message:
      prefix: build
